services:
  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: RaforaInventoryDb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  inventory-api:
    build:
      context: ..
      dockerfile: InventoryApp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=inventory-db;Port=5432;Database=RaforaInventoryDb;Username=postgres;Password=123
    depends_on:
      - inventory-db

volumes:
  pgdata: